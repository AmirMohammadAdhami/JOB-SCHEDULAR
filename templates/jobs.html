{% extends "base.html" %}
{% load static %}

{% block title %}NexusOps - Jobs{% endblock %}

{% block content %}
<div class="header">
    <h1>Jobs</h1>
    <button class="btn btn-primary" onclick="Jobs.openCreateModal()">+ New Job</button>
</div>

<div class="section" style="margin-top: 20px;">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Schedule</th>
                <th>Handler</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Next Run</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="jobs-table">
            <tr><td colspan="7" class="empty-state">Loading...</td></tr>
        </tbody>
    </table>
</div>

<!-- Create/Edit Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h3 id="modal-title">Create Job</h3>
        <input type="hidden" id="edit-job-id">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="job-name" placeholder="e.g. daily_report">
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" id="job-desc" placeholder="What does this job do?">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Schedule Type</label>
                <select id="job-schedule" onchange="Jobs.toggleScheduleFields()">
                    <option value="CRON">CRON</option>
                    <option value="ONE_TIME">One Time</option>
                </select>
            </div>
            <div class="form-group">
                <label>Handler</label>
                <select id="job-handler">
                    <option value="billing_reconciliation">billing_reconciliation</option>
                    <option value="generate_daily_report">generate_daily_report</option>
                    <option value="sync_salesforce_data">sync_salesforce_data</option>
                    <option value="cleanup_temp_files">cleanup_temp_files</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group" id="cron-group">
                <label>Cron Expression</label>
                <input type="text" id="job-cron" placeholder="*/5 * * * *">
            </div>
            <div class="form-group" id="runday-group" style="display:none">
                <label>Run At (UTC)</label>
                <input type="datetime-local" id="job-runat">
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select id="job-priority">
                    <option value="CRITICAL">Critical</option>
                    <option value="HIGH">High</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="LOW">Low</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Timeout (seconds)</label>
                <input type="number" id="job-timeout" value="300" min="10" max="7200">
            </div>
            <div class="form-group">
                <label>Retry Limit</label>
                <input type="number" id="job-retries" value="1" min="1" max="10">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="Jobs.closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="Jobs.saveJob()">Save</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/jobs.js' %}"></script>
<script>Jobs.init();</script>
{% endblock %}
